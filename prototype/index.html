<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>골라주개냥 · 프로토타입</title>
<style>
/* ============================================================
   골라주개냥 프로토타입 — 디자인 토큰
   ============================================================ */
:root{
  --brand:#FF611D; --brand-deep:#C9430B; --brand-soft:#FFF0E8; --brand-line:#FFD1BC;
  --teal:#0E7C7B; --teal-soft:#E4F3F2;
  --ink:#1B1614; --ink2:#5C524E; --ink3:#938884; --ink4:#B8AEA9;
  --line:#EEE7E2; --line2:#E2D9D3;
  --bg:#FAF7F5; --surface:#FFFFFF; --surface2:#F6F2EF;
  --good:#15803D; --good-soft:#E8F6EC; --good-line:#BCE5C7;
  --warn:#B45309; --warn-soft:#FDF3E3; --warn-line:#F3D9A8;
  --bad:#C0271F;  --bad-soft:#FDECEA;  --bad-line:#F5C9C4;
  --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:26px;
  --sh-1:0 1px 2px rgba(50,25,12,.05), 0 1px 8px rgba(50,25,12,.04);
  --sh-2:0 4px 16px -4px rgba(50,25,12,.12);
  --sh-3:0 18px 40px -12px rgba(50,25,12,.28);
  --font:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-size:15px; line-height:1.5;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
ul,ol{margin:0;padding:0;list-style:none}
[hidden]{display:none!important}
svg{width:18px;height:18px;flex:none}
svg.big{width:28px;height:28px}
h1,h2,h3,h4,p{margin:0}
img{max-width:100%;display:block}

/* ============================================================
   무대 + 폰 프레임
   ============================================================ */
.stage{
  min-height:100vh; display:grid; place-items:center; padding:26px 20px;
  background:
    radial-gradient(900px 500px at 50% -12%, #FFE1D2 0%, rgba(255,225,210,0) 62%),
    radial-gradient(700px 500px at 92% 108%, #DCEFEE 0%, rgba(220,239,238,0) 58%),
    var(--bg);
}
.phone{
  position:relative; width:392px; height:min(846px, calc(100vh - 52px));
  background:var(--surface); border-radius:42px; overflow:hidden;
  display:flex; flex-direction:column;
  box-shadow:0 0 0 11px #17110F, 0 0 0 12px #372B26, var(--sh-3);
}
/* iOS 하드웨어 디테일 */
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:104px;height:30px;
  border-radius:99px;background:#17110F;z-index:12;pointer-events:none}
.home-ind{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:136px;height:5px;
  border-radius:99px;background:var(--ink);opacity:.26;z-index:30;pointer-events:none}
@media (max-width:560px){
  .stage{padding:0}
  .phone{width:100%; height:100vh; height:100dvh; border-radius:0; box-shadow:none}
  .island,.home-ind{display:none}
}

/* 상태바 */
.statusbar{
  flex:none; height:44px; padding:0 26px 0 30px; display:flex; align-items:center;
  justify-content:space-between; font-size:13.5px; font-weight:600; letter-spacing:.2px;
  background:var(--surface); color:var(--ink); z-index:5;
}
.statusbar svg{width:15px;height:12px}
.statusbar .sb-r{display:flex;gap:5px;align-items:center;opacity:.85}
.sb-bar{display:inline-flex;align-items:flex-end;gap:1.5px;height:10px}
.sb-bar i{width:3px;background:currentColor;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1.4px solid currentColor;border-radius:3px;padding:1.4px;opacity:.9}
.sb-bat i{display:block;height:100%;width:72%;background:currentColor;border-radius:1px}

/* 앱바 */
.appbar{
  flex:none; min-height:52px; display:flex; align-items:center; gap:8px;
  padding:6px 12px; background:var(--surface); border-bottom:1px solid transparent;
  transition:border-color .18s ease; z-index:4;
}
.appbar.bordered{border-bottom-color:var(--line)}
.appbar h1{font-size:17px;font-weight:700;letter-spacing:-.3px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar.center h1{text-align:center}
.iconbtn{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  color:var(--ink);flex:none;transition:background .15s;
}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.iconbtn .dot{position:absolute;margin:-16px 0 0 15px;width:8px;height:8px;border-radius:50%;
  background:var(--brand);border:2px solid var(--surface)}

/* 스크린 */
.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;background:var(--bg)}
.screen::-webkit-scrollbar{width:0}
.pad{padding:16px}
.pad-x{padding-left:16px;padding-right:16px}
.gap-b{height:20px}
.tabpad{padding-bottom:14px}

/* 탭바 */
.tabbar{
  flex:none;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);
  padding:6px 4px calc(15px + env(safe-area-inset-bottom));
}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 0 3px;color:var(--ink4);font-size:10.5px;font-weight:600;letter-spacing:-.2px;
  position:relative;transition:color .15s}
.tabbar button.on{color:var(--brand)}
.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.85;
  stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on svg{stroke-width:2.2}
.tab-badge{position:absolute;top:1px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;
  border-radius:9px;background:var(--brand);color:#fff;font-size:10px;font-weight:700;
  display:grid;place-items:center;line-height:1}

/* ============================================================
   기본 컴포넌트
   ============================================================ */
.card{background:var(--surface);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh-1)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card+.card{margin-top:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:46px;padding:0 18px;border-radius:var(--r-m);font-size:15px;font-weight:700;
  letter-spacing:-.2px;transition:transform .08s ease, filter .15s, background .15s;}
.btn svg,.chip svg{width:16px;height:16px}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px -6px rgba(255,97,29,.55)}
.btn-primary:hover{filter:brightness(1.04)}
.btn-dark{background:var(--ink);color:#fff}
.btn-line{border:1.5px solid var(--line2);background:var(--surface);color:var(--ink)}
.btn-soft{background:var(--brand-soft);color:var(--brand-deep)}
.btn-ghost{color:var(--ink2)}
.btn-block{display:flex;width:100%}
.btn-sm{height:36px;padding:0 13px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.42;pointer-events:none;box-shadow:none}

.chip{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 13px;
  border-radius:99px;border:1.4px solid var(--line2);background:var(--surface);
  font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap;transition:.14s}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.brand.on{background:var(--brand);border-color:var(--brand)}
.chip-row{display:flex;gap:7px;overflow-x:auto;padding:2px 16px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip-wrap{display:flex;flex-wrap:wrap;gap:7px}

.badge svg{width:12px;height:12px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:7px;
  font-size:11.5px;font-weight:700;letter-spacing:-.2px;line-height:1.35;border:1px solid transparent}
.badge-good{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.badge-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.badge-bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.badge-info{background:var(--teal-soft);color:var(--teal);border-color:#BFE0DE}
.badge-mute{background:var(--surface2);color:var(--ink2);border-color:var(--line)}
.badge-brand{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand-line)}

.sec-title{font-size:17px;font-weight:800;letter-spacing:-.4px;margin-bottom:2px}
.sec-sub{font-size:13px;color:var(--ink3);letter-spacing:-.2px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:11px}
.sec-more{font-size:13px;font-weight:600;color:var(--ink3);flex:none}
.muted{color:var(--ink3)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.hr{height:1px;background:var(--line);margin:16px 0}
.hr.thick{height:8px;background:var(--surface2);margin:0}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.strike{text-decoration:line-through;color:var(--ink4)}

/* 폼 */
.field{margin-bottom:16px}
.label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:7px;letter-spacing:-.2px}
.input{width:100%;height:50px;padding:0 14px;border-radius:var(--r-m);border:1.5px solid var(--line2);
  background:var(--surface);font-size:15px;outline:none;transition:.15s}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input::placeholder{color:var(--ink4)}
textarea.input{height:auto;padding:12px 14px;resize:none;line-height:1.55}
.hint{font-size:12px;color:var(--ink3);margin-top:6px;letter-spacing:-.1px}
.seg{display:grid;gap:8px;grid-auto-flow:column;grid-auto-columns:1fr}
.opt{border:1.5px solid var(--line2);background:var(--surface);border-radius:var(--r-m);
  padding:14px 12px;text-align:center;font-weight:700;font-size:14px;color:var(--ink2);transition:.15s}
.opt .emo{display:block;font-size:26px;margin-bottom:5px;line-height:1}
.opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep);
  box-shadow:0 0 0 3px rgba(255,97,29,.12)}
.stepper{display:flex;align-items:center;gap:4px;border:1.4px solid var(--line2);
  border-radius:10px;padding:3px;background:var(--surface)}
.stepper button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  font-size:17px;font-weight:700;color:var(--ink2)}
.stepper button:hover{background:var(--surface2)}
.stepper span{min-width:26px;text-align:center;font-weight:700;font-size:14px}

/* 진행 바 */
.progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px;
  transition:width .3s cubic-bezier(.4,0,.2,1)}

/* ============================================================
   맞춤 점수 링
   ============================================================ */
.ring{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--rc) calc(var(--v)*1%), var(--line) 0)}
.ring::after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;z-index:1;font-size:20px;font-weight:800;letter-spacing:-.8px;color:var(--rc)}
.ring i{position:relative;z-index:1;font-size:9.5px;font-weight:700;color:var(--ink4);
  font-style:normal;margin-left:1px}
.ring.lg{width:86px;height:86px}
.ring.lg::after{inset:7px}
.ring.lg b{font-size:26px}
.ring.sm{width:44px;height:44px}
.ring.sm::after{inset:4px}
.ring.sm b{font-size:14px}
.ring.sm i{display:none}

/* 성분 게이지 */
.nut{padding:11px 0;border-bottom:1px solid var(--line)}
.nut:last-child{border-bottom:0}
.nut-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.nut-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:5px}
.nut-val{font-size:13.5px;font-weight:800;letter-spacing:-.3px}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar .mark{position:absolute;top:-2px;width:2px;height:11px;background:var(--ink3);border-radius:1px;opacity:.55}
.bar-good i{background:var(--good)} .bar-warn i{background:var(--warn)}
.bar-bad i{background:var(--bad)}   .bar-mute i{background:var(--ink4)}

/* 툴팁 */
.tip{position:relative;display:inline-grid;place-items:center;width:15px;height:15px;
  border-radius:50%;background:var(--line);color:var(--ink2);font-size:10px;font-weight:800;
  cursor:pointer;flex:none}
.tip:hover{background:var(--ink3);color:#fff}

/* ============================================================
   상품 카드
   ============================================================ */
.thumb{background:var(--surface2);display:grid;place-items:center;font-size:40px;
  border-radius:var(--r-m);flex:none;position:relative;overflow:hidden;line-height:1}
.thumb::before{content:'';position:absolute;inset:0;
  background:radial-gradient(70% 70% at 50% 22%, rgba(255,255,255,.85), rgba(255,255,255,0) 70%)}
.thumb>span{position:relative;z-index:1}

.plist{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.plist:last-child{border-bottom:0}
.plist .thumb{width:82px;height:82px;font-size:34px}
.plist .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pbrand{font-size:11.5px;font-weight:700;color:var(--ink3);letter-spacing:-.1px}
.pname{font-size:14.5px;font-weight:700;letter-spacing:-.35px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pprice{font-size:16px;font-weight:800;letter-spacing:-.5px}
.pprice em{font-style:normal;font-size:13.5px;font-weight:800;color:var(--brand);margin-right:5px}
.prate{font-size:11.5px;color:var(--ink3);font-weight:600}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.pcard{text-align:left;display:flex;flex-direction:column;gap:6px}
.pgrid .thumb{width:100%;aspect-ratio:1;font-size:44px}
.pcard-top{position:absolute;top:7px;left:7px;z-index:2}

.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:none}

/* 추천 사유 */
.why{background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:10px;
  padding:8px 10px;font-size:12px;font-weight:600;color:var(--brand-deep);letter-spacing:-.2px;
  display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.why svg{width:14px;height:14px;flex:none;margin-top:1px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}

/* 요인 리스트 */
.factor{display:flex;gap:8px;align-items:flex-start;padding:7px 0;font-size:13.5px;letter-spacing:-.2px;line-height:1.5}
.factor .fi{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;
  margin-top:1px;font-size:11px;font-weight:800;color:#fff}
.factor.plus .fi{background:var(--good)}
.factor.minus .fi{background:var(--warn)}

/* ============================================================
   반려동물 아바타 / 스위처
   ============================================================ */
.pet-ava{width:42px;height:42px;border-radius:50%;background:var(--brand-soft);
  display:grid;place-items:center;font-size:22px;flex:none;border:2px solid var(--brand-line);line-height:1}
.pet-ava.lg{width:62px;height:62px;font-size:31px}
.pet-ava.sm{width:30px;height:30px;font-size:15px;border-width:1.5px}
.pet-ava.ghost{background:var(--surface2);border-color:var(--line2);color:var(--ink4);font-size:20px}

.pethero{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--surface);
  border-radius:var(--r-l);box-shadow:var(--sh-1)}

/* ============================================================
   리뷰
   ============================================================ */
.rev{padding:15px 0;border-bottom:1px solid var(--line)}
.rev:last-child{border-bottom:0}
.rev-head{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px}
.rev-meta{flex:1;min-width:0}
.rev-pet{font-size:12.5px;font-weight:700;letter-spacing:-.2px}
.rev-cond{font-size:11.5px;color:var(--ink3);margin-top:2px;letter-spacing:-.1px}
.stars{color:var(--brand);font-size:12.5px;letter-spacing:1px;line-height:1}
.rev-body{font-size:13.5px;line-height:1.62;letter-spacing:-.2px;color:var(--ink2)}
.rev-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.trust{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}

/* AI 요약 */
.ai{background:linear-gradient(158deg,#FFF7F3 0%,#F1F8F8 100%);
  border:1px solid #F2DED4;border-radius:var(--r-l);padding:15px}
.ai-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;
  color:var(--brand-deep);background:#fff;border:1px solid var(--brand-line);
  padding:3px 8px;border-radius:99px;margin-bottom:11px;letter-spacing:-.1px}
.ai-tag svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.statline{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px}
.statline .sl-n{width:52px;flex:none;font-weight:700;color:var(--ink2)}
.statline .bar{flex:1}
.statline .sl-v{width:36px;text-align:right;font-weight:800;font-size:12px;flex:none}

/* ============================================================
   빈 상태 / 예외 케이스
   ============================================================ */
.empty{text-align:center;padding:44px 26px}
.empty .emo{font-size:46px;line-height:1;margin-bottom:14px;display:block}
.empty h3{font-size:16.5px;font-weight:800;letter-spacing:-.4px;margin-bottom:7px}
.empty p{font-size:13.5px;color:var(--ink3);line-height:1.65;letter-spacing:-.2px}
.empty .acts{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.notice{display:flex;gap:9px;align-items:flex-start;padding:12px 13px;border-radius:var(--r-m);
  font-size:12.5px;line-height:1.55;letter-spacing:-.2px}
.notice svg{width:16px;height:16px;flex:none;margin-top:1px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.notice-info{background:var(--teal-soft);color:#0B5F5E}
.notice-warn{background:var(--warn-soft);color:var(--warn)}
.notice-brand{background:var(--brand-soft);color:var(--brand-deep)}

/* ============================================================
   바텀시트 / 토스트 / 모달
   ============================================================ */
.scrim{position:absolute;inset:0;background:rgba(27,22,20,.42);opacity:0;pointer-events:none;
  transition:opacity .24s ease;z-index:20;backdrop-filter:blur(1px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;transform:translateY(102%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);z-index:21;max-height:86%;
  display:flex;flex-direction:column;box-shadow:0 -8px 34px -10px rgba(50,25,12,.3)}
.sheet.on{transform:translateY(0)}
.sheet-grab{width:38px;height:4px;border-radius:99px;background:var(--line2);margin:10px auto 4px;flex:none}
.sheet-head{padding:8px 18px 12px;flex:none}
.sheet-head h3{font-size:17px;font-weight:800;letter-spacing:-.4px}
.sheet-body{padding:0 18px;overflow-y:auto;flex:1;min-height:0}
.sheet-foot{padding:12px 18px calc(16px + env(safe-area-inset-bottom));flex:none;
  border-top:1px solid var(--line);display:flex;gap:8px}

.toast{position:absolute;left:50%;bottom:88px;transform:translate(-50%,14px);z-index:40;
  background:rgba(27,22,20,.94);color:#fff;padding:11px 17px;border-radius:12px;
  font-size:13.5px;font-weight:600;letter-spacing:-.2px;opacity:0;pointer-events:none;
  transition:.26s cubic-bezier(.32,.72,0,1);max-width:84%;text-align:center;line-height:1.45}
.toast.on{opacity:1;transform:translate(-50%,0)}

  try{ const raw = localStorage.getItem(KEY); if(raw) return {...structuredClone(DEFAULT_STATE), ...JSON.parse(raw)}; }

  return structuredClone(DEFAULT_STATE);
}

/* 받침 유무에 따라 조사를 골라 붙입니다 */
const JOSA = {'은는':['은','는'], '이가':['이','가'], '을를':['을','를'], '과와':['과','와']};
function hasBatchim(str){
  const ch = String(str).trim().slice(-1), code = ch.charCodeAt(0);
  if (code < 0xAC00 || code > 0xD7A3) return true;
  return (code - 0xAC00) % 28 !== 0;
}
function J(name, key){ const [a,b] = JOSA[key]; return esc(name) + (hasBatchim(name) ? a : b); }

/* ============================================================================
   반려동물 도메인 계산
   ========================================================================== */
const STAGE_LABEL = {dog:{puppy:'퍼피', adult:'어덜트', senior:'시니어'},
                     cat:{puppy:'키튼', adult:'어덜트', senior:'시니어'}};
function stageOf(pet){
  const m = pet.ageM ?? 0;
  if (pet.species === 'cat') return m < 12 ? 'puppy' : (m < 120 ? 'adult' : 'senior');
  return m < 12 ? 'puppy' : (m < 84 ? 'adult' : 'senior');
}
const stageLabel = pet => STAGE_LABEL[pet.species][stageOf(pet)];
function ageText(m){
  if (m < 12) return `${m}개월`;
  const y = Math.floor(m/12), r = m%12;
  return r ? `${y}세 ${r}개월` : `${y}세`;
}
const speciesLabel = s => s === 'cat' ? '고양이' : '강아지';
const activePet = () => S.pets.find(p=>p.id===S.activePet) || S.pets[0] || null;
const petLine = pet => `${speciesLabel(pet.species)} · ${sizeOf(pet.size).label} · ${ageText(pet.ageM)} · ${pet.neutered?'중성화 O':'중성화 X'}`;

/* 일일 권장 칼로리 — IA에 체중 입력이 없어 크기 구간 대표값(sizeKg)으로 근사합니다 */
function dailyKcal(pet){
  const kg = sizeKg(pet);
  const rer = 70 * Math.pow(kg, 0.75);
  const st = stageOf(pet);
  let f;
  if (pet.species === 'cat') f = st==='puppy' ? 2.5 : (st==='senior' ? 1.1 : (pet.neutered ? 1.2 : 1.4));
  else                      f = st==='puppy' ? 2.5 : (st==='senior' ? 1.4 : (pet.neutered ? 1.6 : 1.8));
  if (pet.activity === '많음') f += 0.2;
  if (pet.activity === '적음') f -= 0.1;
  if (pet.cares.includes('체중관리')) f -= 0.2;
  return Math.round(rer * f);
}
const gramsPerDay = (pet, p) => p.kcal ? Math.round(dailyKcal(pet) / (p.kcal/100)) : null;

/* IA: 상품 카드의 '하루 급여 / 1개 / 1일 당 가격' — 카테고리마다 기준이 다릅니다 */
function unitPrice(p, pet){
  const price = priceOf(p);
  if (p.cat === 'food'){
    if (!pet) return null;
    const g = gramsPerDay(pet, p); if (!g) return null;
    return {label:'하루 급여당', value: price / p.pack * g};
  }
  if (p.cat === 'treat') return {label:'1개당', value: price / p.pack};
  return {label:'1일당', value: price / p.pack};
}

/* ============================================================================
   적합도 점수 (IA: 메인/추천/상세/비교 공통 지표)
   ========================================================================== */
function fitScore(p, pet){
  if (!pet) return null;
  if (p.species !== 'both' && p.species !== pet.species) return null;

  let score = 46;
  const plus = [], minus = [];
  const st = stageOf(pet), stL = STAGE_LABEL[pet.species][st];
  const sz = sizeOf(pet.size).label;

  /* 생애주기 */
  if (p.stages.includes(st)){ score += 10; plus.push(`${stL} 시기에 맞춰 설계된 제품이에요`); }
  else { score -= 10; minus.push(`${stL} 전용으로 설계된 제품은 아니에요`); }

  /* 크기 (IA: 기본정보 > 크기) */
  if (p.sizes.includes(pet.size)){ score += 6; plus.push(`${sz}견묘에 맞는 알갱이·급여 설계예요`.replace('견묘', speciesLabel(pet.species)==='고양이'?'묘':'견')); }
  else { score -= 7; minus.push(`${sz} 기준으로는 크기·급여량이 맞지 않을 수 있어요`); }

  /* 알레르기 — 가장 강한 감점 요인 */
  const hit = p.allergens.filter(a => pet.allergies.includes(a));
  if (hit.length){
    score -= 38;
    minus.push(`${J(pet.name,'이가')} 피해야 할 <b>${esc(hit.join(', '))}</b>${hasBatchim(hit.join(', '))?'이':'가'} 들어 있어요`);
  } else if (pet.allergies.length){
    score += 6;
    plus.push(`등록한 알레르기 성분이 들어 있지 않아요 · ${esc(pet.allergies.join(', '))}`);
  }

  /* 염려질환 — 가점은 최대 2개까지 */
  const care = p.cares.filter(c => pet.cares.includes(c));
  care.forEach((c,i) => { if (i < 2) score += 7; plus.push(`<b>${esc(c)}</b> 관리를 목적으로 한 성분 구성이에요`); });

  /* 현재 앓고 있는 질병 — 관련 성분을 직접 확인합니다 */
  if (pet.diseases.includes('만성 신장질환')){
    const ph = p.nut.find(n=>n.n==='인');
    if (ph){
      const v = parseFloat(ph.v);
      if (v <= 0.6){ score += 8; plus.push(`인 함량이 ${ph.v}%로 낮아 신장 부담이 적어요`); }
      else if (v >= 1.0){ score -= 12; minus.push(`인 함량이 ${ph.v}%로 높은 편이라 만성 신장질환에는 불리해요`); }
    }
  }
  if (pet.diseases.includes('슬개골 탈구') && p.cares.includes('관절')){ score += 5; plus.push('슬개골 탈구 관리에 쓰이는 관절 성분이 들어 있어요'); }
  if (pet.diseases.includes('아토피 피부염') && p.cares.includes('피부/모질')){ score += 5; plus.push('아토피 피부염 관리에 쓰이는 피부·모질 성분이 들어 있어요'); }
  if (pet.diseases.includes('췌장염')){
    const fat = p.nut.find(n=>n.n==='조지방');
    if (fat && parseFloat(fat.v) >= 16){ score -= 10; minus.push(`조지방 ${fat.v}%로 높은 편이라 췌장염 이력이 있다면 주의가 필요해요`); }
  }

  /* 성분 평가 */
  const good = p.nut.filter(n=>n.g==='good').length;
  const warn = p.nut.filter(n=>n.g==='warn').length;
  score += good * 1.6 - warn * 5;
  p.nut.filter(n=>n.g==='warn').forEach(n => minus.push(`${n.n} ${n.v}${n.u} — 권장 기준(${n.ref})을 벗어나요`));

  /* 리뷰 */
  const rc = reviewsFor(p.id).length;
  if (p.rating) score += (p.rating - 4.3) * 10;
  if (rc === 0){ score -= 4; minus.push('아직 리뷰가 없어 사용 후기를 참고하기 어려워요'); }

  return {score: Math.round(clamp(score, 20, 97)), plus, minus,
          blocked: hit.length > 0, allergyHit: hit};
}
const scoreColor = v => v >= 80 ? 'var(--good)' : v >= 60 ? 'var(--brand)' : v >= 45 ? 'var(--warn)' : 'var(--bad)';
const scoreWord  = v => v >= 80 ? '아주 잘 맞아요' : v >= 60 ? '잘 맞는 편이에요' : v >= 45 ? '확인이 필요해요' : '권장하지 않아요';
const ringHTML = (v, size='') =>
  `<div class="ring ${size}" style="--v:${v};--rc:${scoreColor(v)}"><b>${v}</b><i>점</i></div>`;

/* IA: 추천 상품 화면 > '현재 프로필 상 반려동물에게 중요한 선택 기준' 태그 */
function criteriaTags(pet){
  const t = [];
  pet.allergies.forEach(a => t.push({k:`${a} 제외`, tone:'bad'}));
  pet.diseases.forEach(d => t.push({k:d, tone:'warn'}));
  pet.cares.slice(0,3).forEach(c => t.push({k:`${c} 관리`, tone:'info'}));
  t.push({k:`${STAGE_LABEL[pet.species][stageOf(pet)]} 영양 기준`, tone:'mute'});
  t.push({k:`${sizeOf(pet.size).label} 급여량`, tone:'mute'});
  return t;
}

function recommend(pet, opt={}){
  const list = PRODUCTS
    .map(p => ({p, s: fitScore(p, pet)}))
    .filter(x => x.s)
    .filter(x => opt.cat ? x.p.cat === opt.cat : true)
    .filter(x => opt.includeBlocked ? true : !x.s.blocked);
  list.sort((a,b)=> b.s.score - a.s.score);
  return opt.limit ? list.slice(0, opt.limit) : list;
}

/* ============================================================================
   리뷰 (IA 필터 축: 종 · 체급 · 연령 · 중성화여부 · 건강 관심사)
   ========================================================================== */
const reviewsFor = pid => REVIEWS.filter(r=>r.pid===pid);

function isSimilar(r, pet){
  if (!pet || r.pet.species !== pet.species) return false;
  let hits = 0;
  if (r.pet.size === pet.size) hits++;
  if (stageOf({species:r.pet.species, ageM:r.pet.ageM}) === stageOf(pet)) hits++;
  if (r.pet.cares.some(c => pet.cares.includes(c))) hits++;
  if (r.pet.neutered === pet.neutered) hits++;
  return hits >= 3;
}
function reviewStats(list){
  const m = {};
  list.forEach(r => r.tags.forEach(([k,g]) => {
    m[k] = m[k] || {good:0, total:0};
    m[k].total++; if (g==='good') m[k].good++;
  }));
  return Object.entries(m)
    .map(([k,v]) => ({k, pct: Math.round(v.good/v.total*100), n:v.total}))
    .sort((a,b)=> b.n - a.n || b.pct - a.pct);
}
const stars = n => '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5-n);
const avgRating = list => list.length ? (list.reduce((a,r)=>a+r.rating,0)/list.length) : 0;

   화면 전환 엔진

let FORCE_EMPTY = null;
const HIST = [];
let route = {id:'login', params:{}};
/* IA 대분류 기준 — 장바구니는 탭이 아니라 헤더 버튼입니다 */
const TABS = [
  {id:'main',      icon:'home',   label:'홈'},
  {id:'search',    icon:'search', label:'검색'},
  {id:'recommend', icon:'spark',  label:'추천'},
  {id:'mypage',    icon:'user',   label:'마이페이지'},

function go(id, params={}, replace=false){
  FORCE_EMPTY = null;
  if (!replace && route.id) HIST.push({...route});
  route = {id, params};
  $('#screen').scrollTop = 0;
  render();
}
function back(){
  route = HIST.pop() || {id:'main', params:{}};
  $('#screen').scrollTop = 0; render();
}
function goTab(id){ HIST.length = 0; FORCE_EMPTY = null; route = {id, params:{}}; $('#screen').scrollTop=0; render(); }

function render(){
  const scr = SCREENS[route.id];
  if (!scr){ console.warn('알 수 없는 화면:', route.id); return go('main',{},true); }
  const p = route.params || {};
  paintBar();
  $('#screen').innerHTML = scr.view(p);
  $('#dock').innerHTML = scr.dock ? scr.dock(p) : '';
  $('#tabbar').hidden = !scr.tab;
  if (scr.tab) paintTabs();
  document.title = (scr.title ? scr.title(p)+' · ' : '') + '골라주개냥';
}
function paintBar(){
  const scr = SCREENS[route.id], p = route.params || {};
  const bar = $('#appbar');
  const head = scr.appbar ? scr.appbar(p) : null;
  if (head === null){ bar.hidden = true; bar.innerHTML = ''; }
  else { bar.hidden = false; bar.innerHTML = head; }
}
function paintTabs(){
  $('#tabbar').innerHTML = TABS.map(t=>{
    const on = SCREENS[route.id]?.tab === t.id;
    return `<button class="${on?'on':''}" onclick="goTab('${t.id}')">${ic(t.icon)}<span>${t.label}</span></button>`;
  }).join('');
}

function blankForm(){
  return {mode:'add', id:null, name:'', emo:'🐶', species:null, sex:null, ageM:'',
          size:null, neutered:null, cares:[], diseases:[], allergies:[], activity:null};

function startPetForm(){ FORM = blankForm(); go('petform'); }
function startPetEdit(id){
  const p = S.pets.find(x=>x.id===id); if(!p) return;
  FORM = {mode:'edit', id:p.id, name:p.name, emo:p.emo, species:p.species, sex:p.sex,
          ageM:String(p.ageM), size:p.size, neutered:p.neutered,
          cares:[...p.cares], diseases:[...p.diseases], allergies:[...p.allergies], activity:p.activity};
  go('petedit');
}
function setF(k,v){ FORM[k]=v; render(); }
function toggleIn(key,v){ const i=FORM[key].indexOf(v); i<0?FORM[key].push(v):FORM[key].splice(i,1); render(); }
function formValid(){
  const f = FORM;
  return !!f.species && f.name.trim() && f.sex && f.size && f.activity
      && f.neutered !== null && f.ageM !== '' && !isNaN(f.ageM) && Number(f.ageM) >= 0;
}
function savePet(){
  const f = FORM;
  const data = {name:f.name.trim(), emo:f.emo, species:f.species, sex:f.sex, ageM:Number(f.ageM),
                size:f.size, neutered:f.neutered, cares:[...f.cares], diseases:[...f.diseases],
                allergies:[...f.allergies], activity:f.activity};
  if (f.mode === 'edit'){
    Object.assign(S.pets.find(p=>p.id===f.id), data); save();
    toast('프로필 수정이 완료되었습니다!'); back();
  } else {
    const pet = {id:uid(), ...data};
    S.pets.push(pet); S.activePet = pet.id; save();
    toast('프로필이 등록되었습니다!');
    HIST.length = 0; go('main',{},true);
  }
}

const DEAL_END  = Date.now() + (4*3600 + 37*60) * 1000;
const dealLeft  = () => Math.max(0, Math.floor((DEAL_END - Date.now())/1000));
function hms(sec){
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return [h,m,s].map(v=>String(v).padStart(2,'0'));
}
function countHTML(sec, cls=''){
  const [h,m,s] = hms(sec);
  return `<span class="count ${cls}" data-cd="${sec}"><u>${h}</u><s>:</s><u>${m}</u><s>:</s><u>${s}</u></span>`;
}
setInterval(()=>{
  document.querySelectorAll('[data-cd]').forEach(el=>{
    let v = Math.max(0, (+el.dataset.cd) - 1);
    el.dataset.cd = v;
    const [h,m,s] = hms(v);
    el.innerHTML = `<u>${h}</u><s>:</s><u>${m}</u><s>:</s><u>${s}</u>`;
  });
}, 1000);

  return purchasedPids()

}

let SEARCH = {q:'', submitted:false, sort:'reco'};
const RECENT_Q = ['그레인프리','오리 사료','덴탈껌','유산균','신장 케어'];
const SORTS = {reco:'추천순', pop:'인기순', priceA:'낮은 가격순', priceD:'높은 가격순', rev:'리뷰 많은순'};

function runSearch(q){ SEARCH.q = q; SEARCH.submitted = true; go('searchresult'); }
function searchResults(){
  const pet = activePet(), q = SEARCH.q.trim();
  let list = PRODUCTS.filter(p=>{
    const hay = `${p.brand} ${p.name} ${p.desc} ${p.info} ${p.cares.join(' ')} ${catOf(p.cat).name}`;
    return q.split(/\s+/).every(t => hay.includes(t));
  });
  const out = list.map(p=>({p, s: pet?fitScore(p,pet):null}));
  const by = {
    reco:  (a,b)=> (b.s?.score||0)-(a.s?.score||0) || b.p.rating-a.p.rating,
    pop:   (a,b)=> reviewsFor(b.p.id).length - reviewsFor(a.p.id).length,
    priceA:(a,b)=> priceOf(a.p) - priceOf(b.p),
    priceD:(a,b)=> priceOf(b.p) - priceOf(a.p),
    rev:   (a,b)=> reviewsFor(b.p.id).length - reviewsFor(a.p.id).length,
  };
  out.sort(by[SEARCH.sort] || by.reco);
  return out;
}

function toggleLike(id){
  const i=S.liked.indexOf(id); i<0?S.liked.push(id):S.liked.splice(i,1); save(); render();
  toast(i<0?'찜했어요':'찜을 해제했어요');
}
function addCompare(id){
  if (COMPARE.a === id || COMPARE.b === id) return toast('이미 비교 목록에 있어요');
  if (!COMPARE.a) COMPARE.a = id;
  else if (!COMPARE.b) COMPARE.b = id;
  else { COMPARE.a = COMPARE.b; COMPARE.b = id; }
  go('compare');
}
function buyNow(id){
  const line = S.cart.find(c=>c.pid===id);
  if (line) line.qty += 1; else S.cart.push({pid:id, qty:1, on:true});
  S.cart.forEach(c=> c.on = (c.pid===id));
  save(); go('checkout');
}

/* --------------------------- 상품 상세_영양 성분 분석 영역 (IA 섹션) */
function nutSection(pr, pet){
  const func = pr.nut.filter(n => FUNCTIONAL.test(n.n));
  /* 현재 건강상태(염려질환 + 앓고 있는 질병)와 관련된 주요 성분 */
  const health = pet ? pr.nut.filter(n => {
    const t = [...pet.cares, ...pet.diseases].join(' ');
    if (/피부|모질|아토피/.test(t) && /오메가3|DHA|EPA|조지방|비타민/.test(n.n)) return true;
    if (/신장/.test(t)       && /인|나트륨|조단백/.test(n.n)) return true;
    if (/관절|슬개골/.test(t) && /글루코사민|콘드로이틴|MSM/.test(n.n)) return true;
    if (/체중관리/.test(t)   && /조지방|조섬유|열량/.test(n.n)) return true;
    if (/소화/.test(t)       && /조섬유|유산균|프리바이오/.test(n.n)) return true;
    if (/췌장염/.test(t)     && /조지방/.test(n.n)) return true;
    if (/심장/.test(t)       && /타우린|나트륨/.test(n.n)) return true;
    return false;
  }) : [];
  const warns = pr.nut.filter(n=>n.g==='warn');
  const g = pet ? gramsPerDay(pet, pr) : null;

  /* 최종 영양 성분 분석 요약 */
  let summary;
  if (!pet) summary = '프로필을 등록하면 우리 아이 기준으로 성분을 해석해 드립니다.';
  else if (pr.allergens.some(a=>pet.allergies.includes(a)))
    summary = `${J(pet.name,'이가')} 피해야 할 성분이 들어 있어 권장하지 않습니다. 성분 수치와 무관하게 다른 상품을 먼저 확인해 보세요.`;
  else if (warns.length === 0 && health.length)
    summary = `기준을 벗어난 수치가 없고, ${esc([...pet.cares,...pet.diseases].slice(0,2).join('·'))} 관련 성분도 충분히 들어 있습니다.`;
  else if (warns.length === 0)
    summary = '기준을 벗어난 수치 없이 무난하게 구성된 제품입니다.';
  else
    summary = `${warns.map(n=>n.n).join(', ')} 수치가 권장 기준을 벗어납니다. 다른 항목은 무난한 편이라 급여량과 함께 확인해 보세요.`;

  return `<div class="pad">
    ${an('상품 상세 > 영양 성분 분석 영역 (섹션)', true)}
    <div class="between" style="margin-bottom:11px">
      <div class="sec-title" style="font-size:15.5px">영양 성분 분석</div>
      ${warns.length?`<span class="badge badge-warn">${ic('alert')} 확인 필요 ${warns.length}건</span>`
        :`<span class="badge badge-good">${ic('check')} 기준 이탈 없음</span>`}
    </div>

    ${health.length ? `<div class="card flat" style="border-color:var(--brand-line);background:var(--brand-soft);margin-bottom:12px">
      <b style="font-size:13.5px;color:var(--brand-deep)">${esc(pet.name)}의 건강 상태와 관련된 성분</b>
      <p class="tiny" style="color:var(--brand-deep);margin-top:4px;line-height:1.55">
        등록한 <b>${esc([...pet.cares, ...pet.diseases].join(', '))}</b> 기준으로
        ${health.map(n=>n.n).join(', ')} 수치를 위로 올렸어요.</p>
    </div>`:''}

    <div class="card">
      ${[...health, ...pr.nut.filter(n=>!health.includes(n))].map(n=>`
        <div class="nut">
          <div class="nut-top">
            <span class="nut-name">${esc(n.n)}
              ${health.includes(n)?`<span class="badge badge-brand" style="padding:1px 5px;font-size:10px">주목</span>`:''}
              ${FUNCTIONAL.test(n.n)?`<span class="badge badge-info" style="padding:1px 5px;font-size:10px">기능성</span>`:''}
              <span class="tip" onclick="tipSheet('${esc(n.n)}','${esc(n.tip)}')">?</span></span>
            <span class="nut-val" style="color:${n.g==='warn'?'var(--warn)':n.g==='bad'?'var(--bad)':n.g==='good'?'var(--good)':'var(--ink2)'}">
              ${esc(n.v)}${esc(n.u)}</span>
          </div>
          <div class="bar bar-${n.g}"><i style="width:${n.p}%"></i></div>
          <div class="between" style="margin-top:5px">
            <span class="tiny muted">권장 ${esc(n.ref)}</span>
            ${n.g==='warn'?`<span class="badge badge-warn">기준 이탈</span>`:n.g==='good'?`<span class="badge badge-good">양호</span>`:''}
          </div>
        </div>`).join('')}
    </div>

    ${func.length ? `<div class="card flat" style="margin-top:12px">
      <b style="font-size:13.5px">기능성 성분</b>
      <div class="chip-wrap" style="margin-top:9px">
        ${func.map(n=>`<span class="badge badge-info">${esc(n.n)} ${esc(n.v)}${esc(n.u)}</span>`).join('')}
      </div></div>`:''}

    ${g ? `<div class="card" style="margin-top:12px">
      <div class="between"><b style="font-size:14.5px">${esc(pet.name)}의 하루 급여량</b>
        <span class="tip" onclick="tipSheet('급여량 계산 방식','크기 구간의 대표 체중으로 계산한 휴식기 에너지 요구량(RER)에 생애주기·중성화·활동량 계수를 곱해 하루 필요 칼로리를 구한 뒤, 상품의 100g당 열량으로 나눈 값입니다. 실제 체중과 개체 차이에 따라 달라질 수 있습니다.')">?</span></div>
      <div class="row" style="gap:14px;margin-top:12px">
        <div style="flex:1;background:var(--brand-soft);border-radius:12px;padding:12px;text-align:center">
          <div style="font-size:22px;font-weight:800;color:var(--brand-deep);letter-spacing:-.8px">${g}g</div>
          <div class="tiny" style="color:var(--brand-deep);font-weight:700;margin-top:2px">하루 권장량</div></div>
        <div style="flex:1;background:var(--surface2);border-radius:12px;padding:12px;text-align:center">
          <div style="font-size:22px;font-weight:800;letter-spacing:-.8px">${dailyKcal(pet)}</div>
          <div class="tiny muted" style="font-weight:700;margin-top:2px">kcal / 일</div></div>
      </div>
      <p class="tiny muted" style="margin-top:10px;line-height:1.55">
        2회 급여 시 1회 약 ${Math.round(g/2)}g · ${sizeOf(pet.size).label} 대표 체중 기준 근사값입니다.
        간식은 하루 권장 칼로리의 10%(약 ${Math.round(dailyKcal(pet)*0.1)}kcal) 이내를 권장합니다.</p>
    </div>`:''}

    <div class="card flat" style="margin-top:12px;border-color:var(--line2)">
      <div class="ai-tag" style="margin-bottom:8px">${ic('spark')}최종 영양 성분 분석 요약</div>
      <p class="small" style="color:var(--ink2);line-height:1.65">${summary}</p>
    </div>
  </div>`;
}

    ${reasons.length>3 ? `<button class="btn btn-sm btn-ghost btn-block" style="height:30px"
        onclick="RECO_OPEN['${p.id}']=${!open};render()">${open?'접기':`더보기 (${reasons.length-3}개)`} ${ic(open?'up':'down')}</button>`:''}

    ${cautions.length ? `<div style="margin-top:8px">
      <div style="font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:2px">주의할 내용</div>
      ${(open?cautions:cautions.slice(0,2)).map(t=>`<div class="factor minus" style="padding:5px 0"><span class="fi">!</span><span>${t}</span></div>`).join('')}
    </div>`:''}

  </div>`;
}

   상품 리뷰 화면 (IA: 리뷰)
   ========================================================================== */
let REVF = {similar:true, sort:'reco', species:null, size:null, kgMax:40, cares:[]};
let REV_OPEN = {}, REV_LIKE = {};
const REV_SORTS = {reco:'추천순', new:'최신순', high:'별점 높은순', low:'별점 낮은순'};
const revLikes = r => (r.days % 17) + r.buys * 3 + (REV_LIKE[r.pid+r.pet.name] ? 1 : 0);

function filteredReviews(pid, pet){
  let list = reviewsFor(pid).map((r,i)=>({...r, _i:i}));
  if (REVF.similar && pet) list = list.filter(r => isSimilar(r, pet));
  if (REVF.species) list = list.filter(r => r.pet.species === REVF.species);
  if (REVF.size)    list = list.filter(r => r.pet.size === REVF.size);
  if (REVF.cares.length) list = list.filter(r => r.pet.cares.some(c=>REVF.cares.includes(c)));
  const by = {
    reco:(a,b)=> revLikes(b)-revLikes(a) || b.rating-a.rating,
    new: (a,b)=> b._i - a._i,
    high:(a,b)=> b.rating-a.rating,
    low: (a,b)=> a.rating-b.rating,
  };
  return list.sort(by[REVF.sort] || by.reco);
}

        <p>새로 들어온 상품이라 사용 후기가 없습니다.<br>영양 성분 분석으로 먼저 확인해 보세요.</p>
        <div class="acts"><button class="btn btn-primary btn-block" onclick="go('product',{id:'${pr.id}'})">영양 성분 보러 가기</button></div>

      ${an('예외 — 리뷰가 없는 신상품', true)}</div>`;

    const simCount = pet ? all.filter(r=>isSimilar(r,pet)).length : 0;
    const list = filteredReviews(pr.id, pet);
    const ai = AI_SUMMARY[pr.id] || {pos:[],neg:[]};
    const stats = reviewStats(all);
    const photos = all.filter(r=>r.photos>0);
    const filterOn = REVF.species || REVF.size || REVF.cares.length;

    return `<div class="pad">
      ${an('리뷰 > 상품 리뷰 화면', true)}

      <div class="card">
        <div class="row" style="gap:14px">
          <div style="text-align:center;flex:none">
            <div style="font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1">${avgRating(all).toFixed(1)}</div>
            <div class="stars" style="font-size:13px;margin-top:3px">${stars(Math.round(avgRating(all)))}</div>
            <div class="tiny muted" style="margin-top:4px">리뷰 ${all.length}개</div>
          </div>
          <div style="flex:1;min-width:0">
            ${[5,4,3,2,1].map(n=>{

                <span class="sl-n" style="width:20px">${n}점</span>

        </div>
      </div>

        <div class="ai-tag">${ic('spark')}AI 리뷰 요약</div>
        ${ai.pos.length?`<div style="margin-bottom:9px"><b style="font-size:13px;color:var(--good)">좋았던 점</b>
          ${ai.pos.map(t=>`<div class="factor plus" style="padding:5px 0"><span class="fi">+</span><span>${esc(t)}</span></div>`).join('')}</div>`:''}
        ${ai.neg.length?`<div><b style="font-size:13px;color:var(--warn)">아쉬운 점</b>
          ${ai.neg.map(t=>`<div class="factor minus" style="padding:5px 0"><span class="fi">!</span><span>${esc(t)}</span></div>`).join('')}</div>`:''}
        <div class="hr" style="margin:12px 0"></div>
        <b style="font-size:13px">반응별 통계 <span class="tiny muted" style="font-weight:600">· 리뷰 ${all.length}건 집계</span></b>
        <div style="margin-top:7px">
          ${stats.map(s=>`<div class="statline">
            <span class="sl-n">${esc(s.k)}</span>
            <div class="bar ${s.pct>=70?'bar-good':s.pct>=40?'bar-warn':'bar-bad'}"><i style="width:${s.pct}%"></i></div>
            <span class="sl-v" style="color:${s.pct>=70?'var(--good)':s.pct>=40?'var(--warn)':'var(--bad)'}">${s.pct}%</span>
          </div>`).join('')}
        </div>
        <p class="tiny muted" style="margin-top:8px;line-height:1.5">
          통계는 리뷰 반응 태그를 집계한 값이고, 요약 문장은 AI가 정리한 내용입니다.</p>
      </div>

      ${photos.length ? `<div style="margin-top:20px">
        <div class="sec-head"><div class="sec-title" style="font-size:15px">포토 리뷰</div>
          <button class="sec-more" onclick="toast('포토 리뷰 더보기는 프로토타입 범위 밖입니다')">전체보기</button></div>
        <div class="photos">
          ${photos.slice(0,4).map((r,i)=>`
            <button class="photo" onclick="REVF.similar=false;render();toast('${esc(r.pet.name)} 보호자의 리뷰예요')">
              ${product(r.pid).emo}
              ${i===3 && photos.length>4 ? `<span class="more">+${photos.length-4}</span>`:''}
            </button>`).join('')}
        </div>
      </div>`:''}

      <div class="row" style="gap:7px;margin-top:20px;flex-wrap:wrap">
        ${pet?`<button class="chip brand ${REVF.similar?'on':''}" onclick="REVF.similar=!REVF.similar;render()">
          ${pet.emo} 내 반려동물과 비슷한 리뷰만 ${simCount}</button>`:''}
        <button class="chip brand ${filterOn?'on':''}" onclick="reviewFilterSheet()">${ic('filter')} 기본 필터</button>
        <button class="drop" style="margin-left:auto" onclick="revSortSheet()">${REV_SORTS[REVF.sort]} ${ic('down')}</button>

      ${an('리뷰 > 비슷한 리뷰 필터 · 기본 리뷰 필터 · 정렬', true)}

      ${list.length === 0 ? (REVF.similar && pet ? `

          <span class="emo">🔎</span>
          <h3>${J(pet.name,'과와')} 비슷한 조건의 리뷰가 없어요</h3>
          <p>이 상품은 주로 <b>${summarizeReviewers(all)}</b> 보호자가 남겼어요.<br>

        : `<div class="card" style="margin-top:12px"><div class="empty" style="padding:30px 6px">
            <span class="emo">🫙</span><h3 style="font-size:15px">조건에 맞는 리뷰가 없어요</h3>
            <div class="acts"><button class="btn btn-line btn-block" onclick="resetRevFilter()">필터 초기화</button></div>
          </div></div>`)
      : `<div class="card" style="margin-top:12px;padding:2px 16px">
          ${list.map(r=>reviewCard(r, pet)).join('')}</div>
         ${REVF.similar&&pet?`<p class="tiny muted" style="margin-top:10px;text-align:center;line-height:1.55">
           종 · 체급 · 연령 · 중성화 여부 · 건강 관심사를 기준으로 걸러낸 리뷰입니다</p>`:''}`}
      <div class="gap-b"></div>
    </div>`;
  },
};
function summarizeReviewers(list){
  const st = [...new Set(list.map(r=>STAGE_LABEL[r.pet.species][stageOf({species:r.pet.species,ageM:r.pet.ageM})]))];
  const sz = [...new Set(list.map(r=>sizeOf(r.pet.size).label))];
  return `${st.join('·')} / ${sz.join('·')}`;
}
/* IA: 리뷰별 작성자 반려동물 기본 정보 · 반응 키워드 태그 · 사용기간|만족도|재구매 */
function reviewCard(r, pet){
  const sim = pet && isSimilar(r, pet);
  const rs  = STAGE_LABEL[r.pet.species][stageOf({species:r.pet.species, ageM:r.pet.ageM})];
  const long = r.text.length > 60;
  const open = REV_OPEN[r.pid + r.pet.name];
  const liked = REV_LIKE[r.pid + r.pet.name];
  return `<div class="rev">
    <div class="rev-head">
      <div class="pet-ava sm" style="${sim?'border-color:var(--brand)':''}">${r.pet.species==='cat'?'🐱':'🐶'}</div>
      <div class="rev-meta">
        <div class="row" style="gap:5px">
          <span class="rev-pet">${esc(r.pet.name)}</span>
          ${sim?`<span class="badge badge-brand" style="padding:1px 5px;font-size:10px">비슷한 조건</span>`:''}
        </div>
        <div class="rev-cond">${speciesLabel(r.pet.species)} · ${sizeOf(r.pet.size).label} · ${rs} ·
          ${r.pet.neutered?'중성화 O':'중성화 X'}/${r.pet.sex==='f'?'여아':'남아'} · 활동량 ${r.pet.activity}${r.pet.cares.length?' · '+esc(r.pet.cares.join(', ')):''}</div>
      </div>
      <span class="stars">${stars(r.rating)}</span>
    </div>
    ${r.photos ? `<div class="photos" style="grid-template-columns:repeat(3,1fr);margin-bottom:9px">
      ${Array.from({length:Math.min(r.photos,3)}).map(()=>`<div class="photo">${product(r.pid).emo}</div>`).join('')}
    </div>`:''}
    <div class="row" style="gap:6px;margin-bottom:8px;flex-wrap:wrap">
      <span class="badge badge-mute">${ic('clock')} 사용 ${r.days}일</span>
      <span class="badge badge-mute">만족도 ${r.rating}.0</span>
      <span class="badge badge-mute">재구매 ${r.buys}회</span>
    </div>
    <p class="rev-body">${esc(long && !open ? r.text.slice(0,60)+'…' : r.text)}</p>
    ${long ? `<button class="btn btn-sm btn-ghost" style="height:26px;padding:0;margin-top:4px"
      onclick="REV_OPEN['${r.pid+r.pet.name}']=${!open};render()">${open?'접기':'더보기'} ${ic(open?'up':'down')}</button>`:''}
    <div class="rev-tags">
      ${r.tags.map(([k,g])=>`<span class="badge ${g==='good'?'badge-good':'badge-warn'}">${k} ${g==='good'?'좋음':'아쉬움'}</span>`).join('')}
    </div>
    <div class="row" style="gap:8px;margin-top:10px">
      <button class="btn btn-sm btn-line" style="height:30px;font-size:12.5px;${liked?'border-color:var(--brand);color:var(--brand-deep)':''}"
              onclick="REV_LIKE['${r.pid+r.pet.name}']=${!liked};render()">
        ${ic('heart')} 좋아요 ${revLikes(r)}</button>
      <button class="btn btn-sm btn-ghost" style="height:30px;font-size:12.5px;color:var(--ink4)"
              onclick="toast('신고 페이지로 이동합니다 (외부 폼)')">신고하기</button>
    </div>
  </div>`;
}
function revSortSheet(){
  openSheet(`<div class="sheet-head"><h3>리뷰 정렬</h3></div><div class="sheet-body">
    ${Object.entries(REV_SORTS).map(([k,v])=>`
      <button style="display:flex;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14.5px;font-weight:${REVF.sort===k?'700':'500'}"
        onclick="closeSheet();REVF.sort='${k}';render()"><span style="flex:1">${v}</span>
        ${REVF.sort===k?`<span style="color:var(--brand)">${ic('check')}</span>`:''}</button>`).join('')}
    <div style="height:12px"></div></div>`);
}
/* IA: 상품 리뷰 화면_기본 리뷰 필터 (바텀시트) */
function reviewFilterSheet(){
  openSheet(`<div class="sheet-head"><h3>기본 리뷰 필터</h3></div>
    <div class="sheet-body">
      <div class="field">
        <label class="label">종</label>
        <div class="seg">
          <button class="opt ${REVF.species===null?'on':''}" style="padding:10px" onclick="REVF.species=null;reviewFilterSheet()">전체</button>
          <button class="opt ${REVF.species==='dog'?'on':''}" style="padding:10px" onclick="REVF.species='dog';reviewFilterSheet()">강아지</button>
          <button class="opt ${REVF.species==='cat'?'on':''}" style="padding:10px" onclick="REVF.species='cat';reviewFilterSheet()">고양이</button>
        </div>
      </div>
      <div class="field">
        <label class="label">체형</label>
        <div class="seg">
          <button class="opt ${REVF.size===null?'on':''}" style="padding:10px" onclick="REVF.size=null;reviewFilterSheet()">전체</button>
          ${SIZES.map(s=>`<button class="opt ${REVF.size===s.id?'on':''}" style="padding:10px" onclick="REVF.size='${s.id}';reviewFilterSheet()">${s.label}</button>`).join('')}
        </div>
      </div>
      <div class="field">
        <label class="label">몸무게 <span class="tiny muted" style="font-weight:600">최대 ${REVF.kgMax}kg</span></label>
        <input class="range" type="range" min="2" max="40" step="1" value="${REVF.kgMax}"
               oninput="REVF.kgMax=+this.value;this.previousElementSibling.querySelector('span').textContent='최대 '+this.value+'kg'">
        <div class="notice notice-warn" style="margin-top:10px">${ic('alert')}
          <span><b>확인 필요:</b> IA에 리뷰 필터의 몸무게 슬라이더는 있지만, 프로필 입력에는 체중이 없고 크기(소/중/대)만 있습니다.
          지금은 체형 필터가 실제로 동작하고 몸무게 슬라이더는 표시만 됩니다.</span></div>
      </div>
      <div class="field">
        <label class="label">건강 특이사항</label>
        <div class="chip-wrap">
          ${CARES.map(c=>`<button class="chip brand ${REVF.cares.includes(c)?'on':''}"
            onclick="(REVF.cares.includes('${c}')?REVF.cares.splice(REVF.cares.indexOf('${c}'),1):REVF.cares.push('${c}'));reviewFilterSheet()">${c}</button>`).join('')}
        </div>
      </div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-line" style="flex:1" onclick="resetRevFilter();reviewFilterSheet()">초기화</button>
      <button class="btn btn-primary" style="flex:1.6" onclick="closeSheet();render()">리뷰 보기</button>
    </div>`);
}
function resetRevFilter(){ REVF = {...REVF, species:null, size:null, kgMax:40, cares:[]}; render(); }

/* ============================================================================

SCREENS.compare = {
  title: ()=>'상품 비교',
  appbar: ()=>barBack('상품 비교', barCart()),
  view: ()=>{
    const pet = activePet();
    const a = COMPARE.a && product(COMPARE.a), b = COMPARE.b && product(COMPARE.b);
    const sa = a && pet ? fitScore(a,pet) : null, sb = b && pet ? fitScore(b,pet) : null;
    const rank = {good:3, mute:2, warn:1, bad:0};

    const head = (p, s, slot)=> p ? `
      <div style="flex:1;min-width:0;text-align:center">
        <div class="thumb" style="width:100%;aspect-ratio:1;font-size:40px;margin-bottom:8px"><span>${p.emo}</span></div>

        <button class="btn btn-sm btn-ghost" style="height:26px;margin-top:5px;color:var(--ink4)"
                onclick="COMPARE.${slot}=null;render()">빼기</button>

           <button class="btn btn-sm btn-line" style="margin-top:4px" onclick="back()">고르러 가기</button>
         </div>`;

    if (!a && !b) return `<div class="pad">
      ${an('상품 비교 > 기본 상태 (비워져 있음)', true)}
      <div class="card"><div class="row" style="gap:10px;align-items:stretch">${head(null,null,'a')}${head(null,null,'b')}</div></div>
      <div class="sec-head" style="margin-top:20px"><div><div class="sec-title" style="font-size:15px">이런 조합은 어떠세요?</div>
        <div class="sec-sub">${pet?esc(pet.name)+' 기준 적합도 상위 상품이에요':'인기 상품이에요'}</div></div></div>
      <div class="card" style="padding:2px 16px">

          <button class="plist" onclick="addCompare('${x.p.id}')">

            <div class="info"><div class="pbrand">${esc(x.p.brand)}</div><div class="pname">${esc(x.p.name)}</div></div>
            <span class="btn btn-sm btn-soft" style="align-self:center;pointer-events:none">담기</span></button>`).join('')}
      </div><div class="gap-b"></div></div>`;

    const keys = a && b ? a.nut.map(n=>n.n).filter(n => b.nut.some(m=>m.n===n)) : [];

    return `<div class="pad">
      ${an('상품 비교 > 각 상품 별 정보 나열 (두 축)', true)}

      </div>

      ${(sa&&sa.blocked)||(sb&&sb.blocked)?`<div class="notice notice-warn" style="margin-top:12px">${ic('alert')}
        <span>${[sa&&sa.blocked?esc(a.name):null, sb&&sb.blocked?esc(b.name):null].filter(Boolean).join(', ')}에
        ${esc(pet.name)}의 알레르기 성분이 들어 있어요.</span></div>`:''}

      ${a&&b?`<div class="card" style="margin-top:12px">
        <b style="font-size:14.5px">영양 성분</b>
        <div style="margin-top:10px">
          ${keys.length===0?`<p class="small muted" style="padding:10px 0">

          keys.map(k=>{

            const wa = rank[na.g] > rank[nb.g], wb = rank[nb.g] > rank[na.g];
            const box = (n,win)=>`<div style="flex:1;text-align:center;padding:9px 6px;border-radius:10px;
              background:${win?'var(--good-soft)':'var(--surface2)'};border:1px solid ${win?'var(--good-line)':'transparent'}">

                    `<div class="tiny muted" style="margin-top:2px">${n.g==='warn'?'기준 이탈':'&nbsp;'}</div>`}</div>`;
            return `<div style="padding:9px 0;border-bottom:1px solid var(--line)">
              <div class="row" style="justify-content:center;gap:5px;margin-bottom:7px">
                <span style="font-size:12.5px;font-weight:700;color:var(--ink2)">${esc(k)}</span>
                <span class="tip" onclick="tipSheet('${esc(k)}','${esc(na.tip)}')">?</span></div>
              <div class="row" style="gap:8px">${box(na,wa)}${box(nb,wb)}</div></div>`;
          }).join('')}
        </div>
      </div>

      <div class="card">
        <b style="font-size:14.5px">알레르기 · 주의 성분</b>
        <div class="row" style="gap:8px;margin-top:10px;align-items:flex-start">
          ${[[a,sa],[b,sb]].map(([p,s])=>`<div style="flex:1;min-width:0">

                :'<span class="badge badge-good">주요 알레르겐 없음</span>'}
              ${p.nut.filter(n=>n.g==='warn').map(n=>`<span class="badge badge-warn">${n.n} 기준 이탈</span>`).join('')}
            </div></div>`).join('')}
        </div>
      </div>

      <div class="card">
        <div class="ai-tag" style="margin-bottom:9px">${ic('spark')}AI 요약</div>

}

function paintDrawer(){
  $('#drawerBody').innerHTML = DRAWER.map(([g, items])=>`
    <div class="dgroup"><h4>${g}</h4>
      ${items.map(([k,n,d,fn])=>`
        <button class="ditem" onclick="${fn.replace(/"/g,'&quot;')}">
          <span class="dk">${k}</span>
          <span style="flex:1;min-width:0"><span class="dn">${n}</span><span class="dd">${d}</span></span>
        </button>`).join('')}
    </div>`).join('');
}

document.addEventListener('keydown', e=>{ if (e.key === 'Escape'){ closeDrawer(); closeSheet(); } });

function tick(){
  const d = new Date();
  $('#sb-time').textContent = `${d.getHours()%12||12}:${String(d.getMinutes()).padStart(2,'0')}`;
}
